name: Release and Publish

# Publishing is driven by publishing a GitHub release, not by pushing to a
# branch. Create the release and its tag when you intend to ship; until then
# nothing reaches crates.io, so merging to main is always safe.
on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Derive the version from the release tag and hold it against Cargo.toml, so a
  # mistyped tag fails here rather than shipping under the wrong version.
  version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Resolve and verify version
      id: version
      run: |
        TAG="${{ github.event.release.tag_name }}"
        VERSION="${TAG#v}"
        DECLARED=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f 2)
        if [ "$VERSION" != "$DECLARED" ]; then
          echo "::error::Release tag ${TAG} implies version ${VERSION}, but Cargo.toml declares ${DECLARED}"
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Releasing v${VERSION}"

  test:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    needs: version

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings
      env:
        RUSTFLAGS: "-Dwarnings"

    - name: Run tests
      run: cargo test --release --verbose

    - name: Check documentation
      run: cargo doc --no-deps

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [version, test]

    permissions:
      contents: read
      id-token: write        # required to mint the crates.io OIDC token

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}
        fetch-depth: 0       # merge-base needs real history

    # A GitHub release can be cut from any commit, including one that never
    # landed on main. Publishing is restricted to release tags that are
    # actually contained in main.
    - name: Refuse releases not contained in main
      run: |
        git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
        git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main \
          || { echo "::error::release commit is not contained in main"; exit 1; }

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Verify package can be published
      run: cargo publish --dry-run

    - name: Authenticate to crates.io
      uses: rust-lang/crates-io-auth-action@v1
      id: auth

    - name: Publish to crates.io
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  verify-docs:
    name: Verify Documentation
    runs-on: ubuntu-latest
    needs: [version, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name }}

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Build documentation for docs.rs
      run: |
        cargo doc --no-deps --document-private-items
        echo "Documentation builds successfully"
        echo "Documentation will be automatically available at https://docs.rs/cowfile after publishing"
